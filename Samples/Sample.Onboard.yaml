name: Sample Onboard
version: 1.0
description: Basic onboarding workflow example with hierarchical sections, steps, and plugin-based execution

metadata:
  author: Eric Kincl
  created: 2026-07-10

variables:
  domainName: "corp.example.com"
  globalMethod: "Info"
  sampleImportPath: "./Samples/Sample.Onboard.ImportedSection.yaml"
  logTerminalLevel: "Debug"
  # See Sample.Onboard.Overlay.yaml for an example of how to override these variables in an overlay
  tagsInclude:
    - Documentation
    - Purchase
    - Laptop
    - YubiKey
    - Phone
  tagsExclude:
    - Finance
    - HR

root:
  - type: section
    name: root
    slug: root
    items:
      - type: section
        name: Documentation
        slug: documentation
        items:
          - type: step
            name: Generate random password
            slug: generate-random-password
            plugin: PasswordGenerator
            result: password
            onError: abort
            retry:
              retries: 5
              delay: 10
            parameters:
              length: 16
          - type: step
            name: Generate user PIN
            slug: generate-user-pin
            plugin: PasswordGenerator
            parameters:
              length: 6
              includeNumbers: true
              includeLowercase: false
              includeUppercase: false
              includeSpecial: false
            result: PIN
            defer_binding: true
      - type: section
        name: Pre-Creation
        slug: pre-creation
        description: Various pre-creation steps that need to happen.
        items:
          - type: section
            name: Purchase Hardware
            slug: purchase-hardware
            tags:
              - Purchase
            items:
              - type: step
                name: Laptop
                slug: laptop
                plugin: TextOutput
                parameters:
                  message: Purchasing laptop for {{ fullName }}...
                tags:
                  - Laptop
              - type: step
                name: YubiKey
                slug: yubikey
                plugin: TextOutput
                parameters:
                  message: Purchasing YubiKey for {{ fullName }}...
                tags:
                  - YubiKey
              - type: step
                name: Phone
                slug: phone
                plugin: TextOutput
                parameters:
                  message: Purchasing phone for {{ fullName }}...
                tags:
                  - Phone
          - type: step
            name: Purchase Google Fi phone line
            slug: purchase-google-fi-phone-line
            plugin: TextOutput
            parameters:
              message: Purchasing Google Fi phone line for {{ fullName }}...
            tags:
              - Purchase
              - Google Fi
          - type: step
            name: Purchase Zoom license
            slug: purchase-zoom-license
            plugin: TextOutput
            parameters:
              message: Purchasing Zoom license for {{ fullName }}...
              method: "{{globalMethod}}"
            tags:
              - Purchase
              - Zoom
          - type: step
            name: Pre-Creation Complete
            slug: pre-creation-complete
            description: A "milestone" marker for task management systems
            plugin: TextOutput
            parameters:
              message: Pre-creation steps complete for {{ fullName }}.
              method: "{{globalMethod}}"
            tags:
              - milestone
      - type: step
        name: Imported Sample Content
        slug: imported-sample-content
        plugin: ImportConfig
        parameters:
          uri: "{{sampleImportPath}}"
          sourcePluginName: yamlSource
      - type: section
        name: User Creation/Accounts Setup
        slug: user-creation-accounts-setup
        items:
          - type: section
            name: Create user in Okta
            slug: create-user-in-okta
            items:
              - type: step
                name: Assign generated password
                slug: assign-generated-password
                plugin: TextOutput
                parameters:
                  message: Password for {{ fullName }} is {{ password.object.generatedPassword }}
                    #method: Info
          - type: section
            name: Assign user Okta applications
            slug: assign-user-okta-applications
            tags:
              - Software
            items:
              - type: step
                name: Google
                slug: google
                plugin: TextOutput
                parameters:
                  message: Assigning Google applications to {{ fullName }}...
                  #method: Debug
                tags:
                  - Google
              - type: step
                name: Office365
                slug: office365
                plugin: TextOutput
                parameters:
                  message: Assigning Office365 applications to {{ fullName }}...
                  method: "{{globalMethod}}"
                tags:
                  - Office
              - type: step
                name: Zoom
                slug: zoom
                plugin: TextOutput
                parameters:
                  message: Assigning Zoom applications to {{ fullName }}...
                  method: "{{globalMethod}}"
                tags:
                  - Zoom
      - type: section
        name: Setup Phase
        slug: setup-phase
        tags:
          - setup-computer
          - initial-config
        description: Initial system setup and configuration
        items:
          - type: section
            name: Hardware Configuration
            slug: hardware-configuration
            tags:
              - setup-computer
              - hardware
            items:
              - type: step
                name: Install Base OS
                slug: install-base-os
                tags:
                  - setup-computer
                plugin: TextOutput
                parameters:
                  message: "Installing base operating system..."
                result: osInstalled
              # - type: step
              #   name: Install Drivers
              #   slug: install-drivers
              #   tags:
              #     - setup-computer
              #     - hardware
              #   when: "${osInstalled} == true"
              #   plugin: RunCommand
              #   parameters:
              #     command: "powershell -Command Write-Host 'Installing drivers...'"
              #     timeout: 600
              #   onError: abort
              #   retry:
              #     retries: 3
              #     delay: 0
              #   result: driversInstalled
          - type: section
            name: Network Setup
            slug: network-setup
            when: "{{driversInstalled}} == true"
            tags:
              - setup-computer
              - network
            items:
              - type: step
                name: Configure Network
                slug: configure-network
                tags:
                  - setup-computer
                  - network
                plugin: TextOutput
                parameters:
                  message: "Configuring network adapter..."
                result: networkConfigured
              # - type: step
              #   name: Connect to Domain
              #   slug: connect-to-domain
              #   tags:
              #     - setup-computer
              #     - network
              #   when: "${networkConfigured} == true"
              #   plugin: runCommand
              #   parameters:
              #     command: "powershell -Command Write-Host 'Joining domain: ${domainName}...'"
              #     timeout: 300
              #     stopOnError: false
              #   result: domainJoined
      - type: section
        name: User Enrollment
        slug: user-enrollment
        tags:
          - create-user
          - create-accounts
          - enroll-mdm
        description: User account creation and MDM enrollment
        items:
          - type: section
            name: Account Creation
            slug: account-creation
            tags:
              - create-user
              - create-accounts
            items:
              - type: step
                name: Create User Account
                slug: create-user-account
                tags:
                  - create-user
                  - create-accounts
                plugin: TextOutput
                parameters:
                  message: "Creating user account..."
                result: userCreated
              - type: step
                name: Configure User Permissions
                slug: configure-user-permissions
                tags:
                  - create-user
                plugin: TextOutput
                parameters:
                  message: "Configuring user permissions..."
                result: permissionsConfigured
          - type: section
            name: Mobile Device Management
            slug: mobile-device-management
            tags:
              - enroll-mdm
            description: External configuration for MDM enrollment
            items:
              - type: step
                name: Enroll in MDM
                slug: enroll-in-mdm
                plugin: TextOutput
                parameters:
                  message: "Enrolling device in MDM..."
      - type: section
        name: Software Deployment
        slug: software-deployment
        tags:
          - setup-computer
          - deploy
        description: Deploy required applications and tools
        items:
          - type: step
            name: Deploy Applications
            slug: deploy-applications
            plugin: TextOutput
            parameters:
              message: "Deploying required applications..."
