name: Sample Secrets
version: 1.0
description: Basic onboarding workflow example with hierarchical sections, steps, and plugin-based execution

metadata:
  author: Eric Kincl
  created: 2026-07-10

variables:
  Plugin-Asana-WorkspaceGID: "<your-workspace-gid-here>"

root:
  - type: section
    name: root
    slug: root
    items:
      - type: step
        name: Create Asana Project
        slug: create-asana-project
        plugin: AsanaCreateProject
        tags:
          - asana
        parameters:
          name: "Sample Project 3"
          workspaceGid: "{{Plugin_Asana_WorkspaceGID}}"
        retry:
          retries: 1
          delay: 0
      - type: step
        name: Debug
        slug: debug-create-asana-project
        plugin: TextOutput
        parameters:
          message: "Result: {{step.create-asana-project.result}}"
        defer_binding: true
