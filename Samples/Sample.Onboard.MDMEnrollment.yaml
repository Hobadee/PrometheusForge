name: Mobile Device Management
tags:
  - enroll-mdm
description: MDM enrollment steps

steps:
  - name: Install MDM Agent
    slug: install-mdm-agent
    tags:
      - enroll-mdm
    plugin: runCommand
    options:
      command: "powershell -Command Write-Host 'Installing MDM agent for organization: ${organizationName}...'"
      timeout: 600
      retries: 2
      stopOnError: true
  - name: Enroll Device
    slug: enroll-device
    tags:
      - enroll-mdm
    when: "${mdmAgentInstalled} == true"
    plugin: runCommand
    options:
      command: "powershell -Command Write-Host 'Enrolling device into MDM service...'"
      timeout: 900
      retries: 3
      stopOnError: true
  - name: Apply MDM Policies
    slug: apply-mdm-policies
    tags:
      - enroll-mdm
    when: "${deviceEnrolled} == true"
    plugin: textOutput
    options:
      message: "Applying MDM policies for ${organizationName}..."
