name: Software Deployment
tags:
  - setup-computer
  - deploy
description: Deploy required applications and tools

sections:
  - name: Core Applications
    slug: core-applications
    tags:
      - deploy
      - core-apps
    steps:
      - name: Install Office Suite
        slug: install-office-suite
        tags:
          - deploy
          - core-apps
        plugin: runCommand
        options:
          command: "powershell -Command Write-Host 'Installing Office 365 for ${userName}...'"
          timeout: 1800
          stopOnError: false
        result: officeInstalled

      - name: Install Productivity Tools
        slug: install-productivity-tools
        tags:
          - deploy
          - core-apps
        when: "${officeInstalled} == true"
        plugin: runCommand
        options:
          command: "powershell -Command Write-Host 'Installing productivity suite...'"
          timeout: 900
          stopOnError: false
        result: productivityToolsInstalled

  - name: Security Software
    slug: security-software
    tags:
      - deploy
      - security
    steps:
      - name: Install Antivirus
        slug: install-antivirus
        tags:
          - deploy
          - security
        plugin: runCommand
        options:
          command: "powershell -Command Write-Host 'Installing endpoint protection...'"
          timeout: 600
          stopOnError: true
        result: antivirusInstalled

      - name: Configure Firewall
        slug: configure-firewall
        tags:
          - deploy
          - security
        when: "${antivirusInstalled} == true"
        plugin: textOutput
        options:
          message: "Configuring Windows Firewall for organization: ${organizationName}"
        result: firewallConfigured
